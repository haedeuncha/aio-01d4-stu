[project]
name = "tlog"
version = "0.1.0"
description = "Read workflow run logs (a file or the data API), count them with the course metric definitions, find problems, judge an SLO, and show it all in a TUI"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tlog = "tlog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlog"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
