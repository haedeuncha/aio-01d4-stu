[project]
name = "tbench"
version = "0.1.0"
description = "Call a webhook many times and show how long each call took"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "textual>=0.80"]

[project.scripts]
tbench = "tbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbench"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
