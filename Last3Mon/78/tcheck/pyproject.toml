[project]
name = "tcheck"
version = "0.1.0"
description = "Check CSV · JSON rows against a data schema (the day 78 data API), with the same codes and results as n8n my-check, a batch gate, and a TUI"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tcheck = "tcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcheck"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
