[project]
name = "tops"
version = "0.1.0"
description = "The day 79 operations assistant in the terminal: status, brief, ask, eval gate and audit from n8n my-ops-*, read only, with a TUI"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tops = "tops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tops"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
