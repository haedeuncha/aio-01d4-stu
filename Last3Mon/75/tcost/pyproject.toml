[project]
name = "tcost"
version = "0.1.0"
description = "Count tokens, estimate LLM cost before calling, and sum the usage of n8n test reports"
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "tiktoken>=0.7"]

[project.scripts]
tcost = "tcost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcost"]

[tool.hatch.build.targets.wheel.force-include]
"src/tcost/prices.json" = "tcost/prices.json"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
