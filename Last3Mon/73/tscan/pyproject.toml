[project]
name = "tscan"
version = "0.1.0"
description = "Find secrets and personal data in a folder or in staged git files, shown masked"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tscan = "tscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tscan"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
