[project]
name = "tretry"
version = "0.1.0"
description = "Run a command or an HTTP call with timeout, retry (backoff), a total deadline and a fallback; keep a log and show it"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tretry = "tretry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tretry"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
