[project]
name = "tver"
version = "0.1.0"
description = "Keep n8n workflow files as versions in git and compare two versions node by node"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tver = "tver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tver"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
