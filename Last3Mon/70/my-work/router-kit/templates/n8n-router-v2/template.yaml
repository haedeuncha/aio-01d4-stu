# router-kit 템플릿 v2 · 멀티 Agent 라우터 (B안 · 갈래 설정 표)
name: n8n-router
version: 2   # v1과 다른 점: 답장 모듈 modBuildReply02 (reply 첫 줄 = 처리 요약, 결과에 summary)
description: >
  직원 요청 한 문장을 업무로 나눠 담당 Agent(웹훅)에 보내고, 모듈 modBuildReply01로 답장을 모아 주는 라우터.
  업무 종류(갈래)는 lanes 표에 한 줄씩. 노드 · 연결(흐름)은 바뀌지 않는다.
marker: "[[ 이름 ]]"   # n8n 표현식 {{ }}와 겹치지 않게 다른 모양을 쓴다
requires:
  modules: [modBuildReply02]   # 먼저 push 되어 있어야 함
variables:
  - name: name
    kind: text
    required: true
    description: n8n에 보이는 워크플로우 이름
    example: router-kit · HR 라우터
  - name: path
    kind: path
    required: true
    description: 웹훅 경로 (소문자 · 숫자 · '-'만). 결과 파일 이름도 이것으로 정해진다
    example: rk-hr
  - name: split_prompt
    kind: multiline
    required: true
    description: >
      업무 나누기 LLM의 지시문. 유형 목록(lanes의 키 + other)과 뽑을 칸을 쓰고,
      결과는 반드시 {"shared": {...}, "tasks": [{"type": "...", "text": "...", 칸들}]} 모양으로 달라고 쓴다.
  - name: lanes
    kind: lanes   # JSON 표 + 갈래 검사 (agent · body · required)
    required: true
    description: >
      갈래 설정 표 (JSON 객체). 키 = 업무 유형. 값 = {agent: 웹훅 경로, body: {Agent가 받는 이름: 꺼낼 곳},
      required: [꼭 필요한 칸], ask: 빠졌을 때 물을 말}. body의 꺼낼 곳은
      "user"(웹훅 입력) · "text"(업무 문장) · 칸 이름 · "a|b"(앞이 비면 뒤) · "body.칸"(웹훅 본문) · "{칸} 글자"(끼워 넣기)
    example: {"policy": {"agent": "a3-hr-policy", "body": {"question": "text", "user": "user"}, "required": []}}
  - name: shared
    kind: json
    required: false
    default: []
    description: 요청 전체에서 한 번만 뽑아 모든 업무에 붙이는 칸 이름 목록 (예 출장 ["city", "start", "end"])
  - name: other_answer
    kind: text
    required: true
    description: 맡을 수 없는 업무(other)에 돌려줄 안내 문장
  - name: example_user
    kind: text
    required: true
    description: 기본 테스트에 쓸 직원 이름
    example: 박서연
  - name: other_example
    kind: text
    required: true
    description: 기본 테스트의 "범위 밖" 요청 문장 (이 라우터가 맡지 않는 일)
    example: 월급 언제 들어와?
files:
  - "[[ path ]].json"               # 라우터 워크플로우
  - "cases/[[ path ]]-basic.json"   # 기본 테스트 3개 (업무별 테스트는 따로 쓴다)
